name: smart_hub
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # BLE packages
  flutter_reactive_ble: ^5.4.0
  permission_handler: ^11.3.1

  #Alerts
  fluttertoast: ^8.2.8
  rflutter_alert: ^2.0.7


  # UI packages
  cupertino_icons: ^1.0.2
  animations: ^2.0.11
  skeleton_text: ^3.0.1
  animated_text_kit: ^4.2.2
  loading_animation_widget: ^1.2.0+4
  vibration: ^1.9.0
  buttons_tabbar: ^1.3.13
  slider_button: ^2.1.0
  card_loading: ^0.3.2
  ripple_wave: ^0.1.4

  #Mobile Settings
  app_settings: ^5.1.1

  #Local Storage
  shared_preferences: ^2.3.2

  #Restart Application
  flutter_phoenix: ^1.1.1

  #provider
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - images/

  fonts:
    - family: GoogleFontOne
      fonts:
        - asset: fonts/PlaywriteHU-VariableFont_wght.ttf

    - family: GoogleFontTwo
      fonts:
        - asset: fonts/EduQLDBeginner-VariableFont_wght.ttf
